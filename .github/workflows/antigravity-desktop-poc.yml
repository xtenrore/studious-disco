name: Build Antigravity Desktop POC
on:
  push:
    branches:
      - poc/antigravity-mobile-desktop
    paths:
      - railway-antigravity-poc/**
      - .github/workflows/antigravity-desktop-poc.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  desktop-image:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out POC branch
        uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Sign in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish from official Google Linux download
        uses: docker/build-push-action@v6
        with:
          context: ./railway-antigravity-poc
          push: true
          tags: ghcr.io/xtenrore/antigravity-mobile-poc:latest
          labels: org.opencontainers.image.source=https://github.com/xtenrore/studious-disco
